services:
  proxy:
    build: ./proxy
    container_name: proxy

  broker:
    build: ./broker
    container_name: broker

  referencia:
    build: ./referencia
    container_name: referencia

  servidor1:
    build: ./servidor
    container_name: servidor1
    working_dir: /dados
    environment:
      SERVIDOR_PORTA: "8001"
    volumes:
      - dados_servidor1:/dados
    depends_on:
      - broker
      - proxy
      - referencia

  servidor2:
    build: ./servidor
    container_name: servidor2
    working_dir: /dados
    environment:
      SERVIDOR_PORTA: "8002"
    volumes:
      - dados_servidor2:/dados
    depends_on:
      - broker
      - proxy
      - referencia

  bot1:
    build: ./bot
    container_name: bot1
    environment:
      BOT_NOME: Luanna
      BOT_CANAL: promos
    depends_on:
      - servidor1
      - servidor2

  bot2:
    build: ./bot
    container_name: bot2
    environment:
      BOT_NOME: Roberta
      BOT_CANAL: sextou
    depends_on:
      - servidor1
      - servidor2

  bot3:
    build: ./bot
    container_name: bot3
    environment:
      BOT_NOME: Nelson
      BOT_CANAL: top restuarantes
    depends_on:
      - servidor1
      - servidor2

  bot4:
    build: ./bot
    container_name: bot4
    environment:
      BOT_NOME: Masashi
      BOT_CANAL: jogos pro pc
    depends_on:
      - servidor1
      - servidor2

volumes:
  dados_servidor1:
  dados_servidor2: